// ===== タスク一覧画面(専用) =====
function populateListFilterSelect() {
  const sel = document.getElementById('listFilterSelect');
  const prevVal = sel.value;
  sel.innerHTML = '<option value="">すべての場所</option><option value="__none__">指定なし</option>';
  LOCATIONS.forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc; opt.textContent = loc;
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === prevVal)) sel.value = prevVal;
}

// 兄弟(同じparentIdの分解手順)をorder順にまとめて隣接させ、インデント対象としてマークする
// 分解タスクの系列(大元が同じ手順たち。子・孫まで含む)をまとめて隣接させる。
// 深さ→order順に並べ、各カードに表示用の深さ(_listDepth)を付与して返す
function groupSiblingsForList(list) {
  const seen = new Set();
  const result = [];
  list.forEach(c => {
    // 後方互換:rootParentIdが無い古いデータはparentIdをそのまま使う
    const rootKey = c.rootParentId || c.parentId;
    if (rootKey != null) {
      if (seen.has(rootKey)) return;
      seen.add(rootKey);
      list.filter(x => (x.rootParentId || x.parentId) === rootKey)
        .sort((a, b) => {
          const da = a.depth || (a.parentId != null ? 1 : 0);
          const db = b.depth || (b.parentId != null ? 1 : 0);
          if (da !== db) return da - db;
          return (a.order ?? 0) - (b.order ?? 0);
        })
        .forEach(s => result.push(s));
    } else {
      result.push(c);
    }
  });
  return result;
}

function renderTaskList() {
  const area = document.getElementById('taskListArea');
  area.innerHTML = '';

  const filterVal = document.getElementById('listFilterSelect').value;
  let filtered = cards;
  if (filterVal === '__none__') filtered = cards.filter(c => !c.location);
  else if (filterVal) filtered = cards.filter(c => c.location === filterVal);

  if (filtered.length === 0) {
    area.innerHTML = '<div style="font-size:13px; color:var(--text-muted); padding:16px 0;">該当するタスクがありません</div>';
    return;
  }

  const sortMode = document.getElementById('listSortSelect').value;

  // その階層(同じparentId)の中で、今もcardsに存在する兄弟だけを並べた時の、
  // このカードが何番目(0始まり)に来るか。先頭=0、次=1、その次=2…と階段状に増える。
  // 手前の手順が完了などで無くなると、残った兄弟の番号が自動的に繰り上がる
  const staircaseRank = (c) => {
    if (c.parentId == null) return 0;
    const siblings = cards.filter(x => x.parentId === c.parentId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const idx = siblings.findIndex(s => s.id === c.id);
    return idx === -1 ? 0 : idx;
  };

  const renderRows = (list) => {
    const grouped = groupSiblingsForList(list);
    // 先に各行の表示用の深さを計算しておく(接続判定に前後の深さが必要なため)
    const items = grouped.map(c => {
      const rawDepth = c.depth || (c.parentId != null ? 1 : 0);
      const baseDepth = Math.max(0, rawDepth - 1); // 孫以降は、その分だけ基礎インデントを上乗せ
      const depth = baseDepth + staircaseRank(c); // 兄弟内の順番ぶん、階段状に増やす
      const rootKey = c.rootParentId || c.parentId || null;
      return { c, depth, rootKey };
    });
    items.forEach((item, i) => {
      const { c, depth, rootKey } = item;
      const prev = items[i - 1];
      const next = items[i + 1];
      // 同じ系列(グループ)内であれば、先頭行を含めて全部つなげて詰める。
      // 別の(無関係な)タスクとの境目だけ、通常の区切りに戻る
      const connectedToPrev = !!prev && rootKey != null && rootKey === prev.rootKey;
      const connectedToNext = !!next && rootKey != null && rootKey === next.rootKey;

      const row = document.createElement('div');
      row.className = 'task-list-row' + (depth > 0 ? ' indent' : '');
      row.style.paddingLeft = depth > 0 ? `${14 + (depth - 1) * 16}px` : '';
      if (connectedToPrev) row.style.paddingTop = '3px';
      if (connectedToNext) { row.style.paddingBottom = '3px'; row.style.borderBottom = 'none'; }
      const dot = document.createElement('span');
      dot.className = 'tl-want-dot';
      const dotColorVar = ['var(--red-border)', 'var(--amber-border)', 'var(--green-border)', 'var(--blue-border)'][c.want] || 'var(--border-strong)';
      dot.style.background = dotColorVar;
      const title = document.createElement('span');
      title.className = 'tl-title';
      title.textContent = c.title.replace(/\n+/g, ' '); // 改行は半角スペースに置き換えて1行表示にする(超過分は既存CSSの省略表示に任せる)
      title.title = 'ダブルクリック(長押し)で名前を変更';
      const loc = document.createElement('span');
      loc.className = 'tl-loc';
      loc.textContent = c.location || '';

      const startTitleRenameUI = () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = c.title;
        input.className = 'tl-title-input';
        input.onclick = (e) => e.stopPropagation();
        row.replaceChild(input, title);
        input.focus();
        input.select();
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          const trimmed = input.value.trim();
          if (trimmed) {
            cards = cards.map(x => x.id === c.id ? {...x, title: trimmed} : x);
            saveCards(cards);
          }
          renderTaskList();
        };
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); finish(); }
          if (ev.key === 'Escape') { done = true; renderTaskList(); }
        });
        input.addEventListener('blur', finish);
      };
      title.ondblclick = (e) => { e.stopPropagation(); startTitleRenameUI(); };
      // タッチ操作向け:長押しでリネーム開始
      let titleLongPressTimer = null;
      let titleTouchStartX = 0, titleTouchStartY = 0;
      title.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') return;
        titleTouchStartX = e.clientX; titleTouchStartY = e.clientY;
        titleLongPressTimer = setTimeout(() => {
          titleLongPressTimer = null;
          startTitleRenameUI();
        }, 500);
      });
      title.addEventListener('pointermove', (e) => {
        if (!titleLongPressTimer) return;
        if (Math.abs(e.clientX - titleTouchStartX) > 10 || Math.abs(e.clientY - titleTouchStartY) > 10) {
          clearTimeout(titleLongPressTimer); titleLongPressTimer = null;
        }
      });
      const cancelTitleLongPress = () => { if (titleLongPressTimer) { clearTimeout(titleLongPressTimer); titleLongPressTimer = null; } };
      title.addEventListener('pointerup', cancelTitleLongPress);
      title.addEventListener('pointercancel', cancelTitleLongPress);
      title.addEventListener('pointerleave', cancelTitleLongPress);

      const delBtn = document.createElement('button');
      delBtn.className = 'tl-del-btn';
      delBtn.textContent = '×';
      delBtn.title = 'このタスクを削除';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        const siblings = c.parentId != null ? cards.filter(x => x.parentId === c.parentId) : [];
        const isFirst = siblings.length > 0 && (c.order ?? 0) === Math.min(...siblings.map(s => s.order ?? 0));
        const hasSiblings = isFirst && siblings.length > 1;
        const msg = hasSiblings
          ? `「${c.title}」を削除しますか?(同じ分解タスクの他の手順もまとめて削除されます)`
          : `「${c.title}」を削除しますか?`;
        customConfirm(msg, () => {
          deleteCard(c.id);
          renderTaskList();
        });
      };

      row.appendChild(dot);
      row.appendChild(title);
      if (c.location) row.appendChild(loc);
      row.appendChild(delBtn);
      row.onclick = () => {
        document.getElementById('listOverlay').classList.remove('open');
        openEdit(c);
      };
      area.appendChild(row);
    });
  };

  if (sortMode === 'location') {
    const orderOf = (loc) => {
      if (!loc) return -1;
      const idx = LOCATIONS.indexOf(loc);
      return idx === -1 ? LOCATIONS.length : idx;
    };
    const buckets = new Map();
    filtered.forEach(c => {
      const key = c.location || '';
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(c);
    });
    [...buckets.keys()].sort((a, b) => orderOf(a) - orderOf(b)).forEach(key => {
      const header = document.createElement('div');
      header.className = 'task-list-group-header';
      header.textContent = key || '指定なし';
      area.appendChild(header);
      renderRows(buckets.get(key));
    });
  } else {
    renderRows(filtered);
  }
}

  const keepShowingId = currentCard ? currentCard.id : null; // 編集によって前面のカードが変わらないようにする

  if (editingId) {
    cards = cards.map(c => c.id === editingId ? {...c, title, time, location, want, loopType} : c);
  } else {
    cards.push({id: uid(), title, time, want, location, loopType, order:null, parentId:null, skipStreak:0, availableAfter:0});
    pendingRevealAnim = true; // 新規登録の時だけ、次のカードをめくる演出を出す
    pendingShuffleAnim = true; // デッキ全体がシャッフルされる演出も合わせて出す
  }
  saveCards(cards);
  closeOverlay();

  if (editingId) {
    // 編集時は、そのカードが今表示中だったかに関わらず、編集前と同じカードをそのまま表示し続ける
    const stayCard = cards.find(x => x.id === keepShowingId);
    drawCard(stayCard || undefined);
  } else {
    drawCard();
  }
};
document.getElementById('deleteBtn').onclick = () => {
  if (editingId) deleteCard(editingId);
  closeOverlay();
};
document.getElementById('decomposeFromEditBtn').onclick = () => {
  const target = cards.find(x => x.id === editingId);
  if (!target) return;
  const sheet = document.getElementById('cardSheet');
  if (sheet.classList.contains('card-back')) {
    // 編集画面(カード裏面)は回転して閉じる演出を挟むため、それが終わってから分解画面を開く
    sheet.addEventListener('animationend', () => openDecompose(target), { once: true });
    closeOverlay();
  } else {
    closeOverlay();
    openDecompose(target);
  }
};

function populateLocationSelect() {
  const sel = document.getElementById('fLocation');
  const prevVal = sel.value;
  sel.innerHTML = '';
  const optNone = document.createElement('option');
  optNone.value = ''; optNone.textContent = '指定なし';
  sel.appendChild(optNone);
  LOCATIONS.forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc; opt.textContent = loc;
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === prevVal)) sel.value = prevVal;
}

// ===== 設定オーバーレイの開閉・各ボタン =====
document.getElementById('settingsBtn').onclick = () => {
  renderSettingsUI();
  document.getElementById('settingsOverlay').classList.add('open');
};
document.getElementById('settingsCloseBtn').onclick = () => {
  document.getElementById('settingsOverlay').classList.remove('open');
};
document.getElementById('settingsOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'settingsOverlay') document.getElementById('settingsOverlay').classList.remove('open');
});
document.getElementById('dbxConnectBtn').onclick = () => { startDropboxAuth(); };
document.getElementById('dbxSyncNowBtn').onclick = async () => {
  setDbxMsg('同期中...');
  const remote = await downloadFromDropbox();
  applyRemoteData(remote);
  await uploadToDropbox();
};
document.getElementById('dbxDisconnectBtn').onclick = () => { disconnectDropbox(); };
document.getElementById('notifEnableBtn').onclick = async () => {
  if (typeof Notification === 'undefined') return;
  const perm = await Notification.requestPermission();
  renderSettingsUI();
};

// ===== 初期化 =====
// 同期データが無い(未接続・Dropbox側に何も無い)場合の、通常の初期表示
function drawInitialCardWithoutRemote() {
  renderLocationMenu();
  populateLocationSelect();
  document.getElementById('locationLabel').textContent = `今いる場所:${currentLocation || '指定なし'}`;
  drawCard();
}

async function initApp() {
  // Dropbox認証からのリダイレクト(?code=...)が来ていれば処理する
  const justAuthed = await handleDropboxOAuthCallback();

  if (isDropboxConnected()) {
    await initDropbox();
    const remote = await downloadFromDropbox();
    if (remote) {
      // 「今いる場所」「前面カード」も含めて、他端末の状態をそのまま反映する
      applyRemoteData(remote);
    } else {
      // Dropbox側にまだファイルが無い(初回接続時など)場合は、今の手元のデータをアップロードしておく
      uploadToDropbox();
      drawInitialCardWithoutRemote();
    }
  } else {
    drawInitialCardWithoutRemote();
  }

  if (justAuthed) {
    renderSettingsUI();
    document.getElementById('settingsOverlay').classList.add('open');
  }
}
initApp();
</script>
