<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface-2: #ececE6;
    --border: #dedad0;
    --border-strong: #c7c2b4;
    --text: #2c2c2a;
    --text-secondary: #6a6a64;
    --text-muted: #a3a096;
    --accent: #2c2c2a;
    --accent-text: #ffffff;
    --red-bg: #fcebeb;   --red-border: #e24b4a; --red-text: #791f1f;
    --amber-bg: #faeeda; --amber-border: #ef9f27; --amber-text: #633806;
    --green-bg: #eaf3de; --green-border: #97c459; --green-text: #27500a;
    --blue-bg: #e6f1fb;  --blue-border: #378add; --blue-text: #0c447c;
    --red-vivid-1: #f26d67;   --red-vivid-2: #cf3535;
    --amber-vivid-1: #ffb648; --amber-vivid-2: #ec8c0d;
    --green-vivid-1: #8ed158; --green-vivid-2: #549c2c;
    --blue-vivid-1: #5b9fe8;  --blue-vivid-2: #2a6dc4;
    --frame-gray: #808080;
    --frame-gray-light: #949494;
    --frame-gray-dark: #686868;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  /* 演出用の装飾要素がカードの外へはみ出しても、ページ自体のスクロールバーが
     発生しないようにする(はみ出し分でクリック位置がズレるのを防ぐ) */
  html, body { overflow: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .logo {
    position: fixed; top: calc(18px + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left));
    font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: #1a1a1a;
    z-index: 10;
  }
  .settings-btn {
    position: fixed; top: calc(16px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
    width: 32px; height:32px; border-radius:50%; z-index:10;
    background: transparent; border: none; color: #1a1a1a; opacity:0.6;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .settings-btn:hover { opacity:1; }
  .settings-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .settings-section:last-of-type { border-bottom: none; }
  .settings-section-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .settings-desc { font-size: 12px; color: var(--text-secondary); line-height:1.6; margin: 4px 0 10px; }
  .settings-action-btn {
    height: 38px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); cursor: pointer; width: 100%; margin-top: 6px;
  }
  .settings-action-btn.primary { background: var(--accent); color: var(--accent-text); border: none; }
  .settings-action-btn.danger { color: var(--red-text); border-color: var(--red-border); }
  .app {
    width: 100%;
    max-width: 420px;
  }

  /* 上部:現在地セレクタ(デッキの外) */
  .location-wrap { display:flex; justify-content:center; margin-bottom: 28px; position: relative; }
  .location-pill {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    display:flex; align-items:center; gap:6px; color: var(--text);
  }
  .location-menu {
    position:absolute; top: calc(100% + 6px); left:50%; transform: translateX(-50%);
    background: var(--surface); border:1px solid var(--border); border-radius:8px;
    width: 230px; overflow:hidden; z-index: 30; display:none; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .location-menu.open { display:block; }
  .location-menu div { padding: 9px 14px; font-size: 13px; cursor:pointer; border-top:1px solid var(--border); }
  .location-menu div:first-child { border-top:none; }
  .location-menu div:hover { background: var(--surface-2); }
  .location-menu div.active { background: var(--surface-2); font-weight:600; }

  /* ポイントボタン付近のカウントダウン */
  .points-countdown-badge {
    position: fixed;
    right: calc(24px + 54px + 12px + 54px + 12px + env(safe-area-inset-right) - 12px);
    bottom: calc(24px + 54px + 8px + env(safe-area-inset-bottom));
    width: 78px; text-align:center;
    font-size: 11px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 3px 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    pointer-events:none;
    z-index: 5;
  }
  /* 連続スキップの残り無償回数を示すゲージ。ポイントボタンの真上、カウントダウンバッジのすぐ下に一直線で並べる */
  .skip-gauge {
    position: fixed;
    right: calc(24px + 54px + 12px + 54px + 12px + env(safe-area-inset-right) - 12px);
    bottom: calc(24px + 54px + 3px + env(safe-area-inset-bottom));
    width: 78px;
    display: flex; gap: 4px;
    pointer-events: none;
    z-index: 5;
  }
  .skip-gauge .skip-gauge-seg {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--border-strong);
    transition: background-color 0.2s ease, opacity 0.2s ease;
  }
  .skip-gauge .skip-gauge-seg.filled { background: var(--accent); }

  /* カードスタック */
  .stack {
    position: relative;
    width: 280px; height: 400px;
    margin: 0 auto 24px;
    transform: translateX(-14px); /* カードが右下に扇状へ広がる分、見た目の重心を少し左へ補正する */
  }
  .stack .ghost {
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--frame-gray-light) 0%, var(--frame-gray-dark) 100%);
    border-radius: 18px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    z-index: 1;
    box-sizing: border-box;
    transition: transform 0.4s ease;
    overflow: hidden;
  }
  .card {
    position:absolute; inset:0;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--frame-gray-light) 0%, var(--frame-gray-dark) 100%);
    display:block;
    transition: transform 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 3px 8px rgba(0,0,0,0.10);
    z-index: 10;
    overflow: hidden;
  }
  /* 物理的なカードっぽさを出すための、斜めの光帯(白ではなくわずかに明度を上げるだけ) */
  .card::before, .stack .ghost::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg,
      transparent 32%,
      rgba(255,255,255,0.10) 44%,
      rgba(255,255,255,0.22) 50%,
      rgba(255,255,255,0.10) 56%,
      transparent 68%);
    pointer-events: none;
    z-index: 6;
  }
  /* 内側:角丸なし(角ばった)色つきエリア。下だけ縁を太くしてアイコン列を内包する */
  .card .card-inner {
    position:absolute; top:14px; left:14px; right:14px; bottom:64px;
    border-radius: 0;
    border: 5px solid rgba(255,255,255,0.9);
    padding: 18px;
    display:flex; flex-direction:column;
    box-sizing: border-box;
  }
  /* 控えの奥側:実体は本物のカードだが、見た目だけダミー風に覆い隠す */
  .card.masked .card-inner, .card.masked .icon-action-row, .card.masked .time-tab { visibility: hidden; }
  /* 新規タスク登録・場所切り替え時:デッキの上半分らしきカードが弧を描いて下へ移り、切られたように見える */
  .cut-card {
    position:absolute; inset:0;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--frame-gray-light) 0%, var(--frame-gray-dark) 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    z-index: 30;
    pointer-events: none;
    animation: cardCut 0.5s cubic-bezier(0.3, 0, 0.4, 1) forwards;
    transform-origin: 50% 100%;
  }
  @keyframes cardCut {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    35%  { transform: translate(64px, -70px) rotate(14deg); opacity: 1; }
    70%  { transform: translate(22px, 110px) rotate(6deg); opacity: 0.95; }
    100% { transform: translate(0, 190px) rotate(0deg); opacity: 0; }
  }
  /* 同時に、左上から斜めに滑り込んできて背面(控えの一番手前)に収まるカード */
  .cut-card-in {
    position:absolute; inset:0;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--frame-gray-light) 0%, var(--frame-gray-dark) 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    z-index: 0;
    pointer-events: none;
    animation: cardCutIn 0.5s cubic-bezier(0.3, 0, 0.4, 1) forwards;
  }
  @keyframes cardCutIn {
    0%   { transform: translate(-150px, -170px) rotate(-20deg); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translate(8px, 8px) rotate(0deg); opacity: 1; }
  }
  /* 少し遅れて、右上から滑り込んできて2番目の控えの位置に収まるカード */
  .cut-card-in2 {
    position:absolute; inset:0;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--frame-gray-light) 0%, var(--frame-gray-dark) 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    z-index: -1;
    pointer-events: none;
    animation: cardCutIn2 0.5s cubic-bezier(0.3, 0, 0.4, 1) 0.09s forwards;
    opacity: 0;
  }
  @keyframes cardCutIn2 {
    0%   { transform: translate(150px, -170px) rotate(20deg); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translate(17px, 17px) rotate(0deg); opacity: 1; }
  }
  .card.reveal { animation: cardReveal 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes cardReveal {
    0% { transform: scale(0.92) rotate(-3deg) translateY(8px); opacity: 0; }
    60% { transform: scale(1.02) rotate(1deg) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) rotate(0deg) translateY(0); opacity: 1; }
  }
  /* 完了・スキップ後:控えの一番手前の位置から新しいカードが繰り上がる */
  .card.promote { animation: cardPromote 0.24s ease-out; }
  @keyframes cardPromote {
    0% { transform: translate(8px, 8px) scale(0.98); }
    100% { transform: translate(0, 0) scale(1); }
  }
  /* 完了:画面外に飛んでいく */
  .card.fly-out {
    animation: cardFlyOut 0.38s cubic-bezier(0.4, 0, 1, 1) forwards;
    pointer-events: none;
  }
  @keyframes cardFlyOut {
    0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(160%, -60%) rotate(28deg) scale(0.9); opacity: 0; }
  }
  /* スキップ:一度デッキの外へ完全に出てから、最背面に滑り込む */
  .card.to-back {
    animation: cardToBack 0.5s ease-in-out forwards;
    pointer-events: none;
  }
  @keyframes cardToBack {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; z-index: 10; }
    32%  { transform: translate(-155%, -20%) scale(1) rotate(-12deg); opacity: 1; z-index: 10; }
    33%  { transform: translate(-155%, -20%) scale(1) rotate(-12deg); opacity: 1; z-index: 0; }
    70%  { transform: translate(28px, 28px) scale(1) rotate(0deg); opacity: 1; z-index: 0; }
    100% { transform: translate(28px, 28px) scale(1) rotate(0deg); opacity: 0; z-index: 0; }
  }
  .card-inner.want-0 { background: linear-gradient(160deg, var(--red-vivid-1) 0%, var(--red-vivid-2) 100%); }
  .card-inner.want-1 { background: linear-gradient(160deg, var(--amber-vivid-1) 0%, var(--amber-vivid-2) 100%); }
  .card-inner.want-2 { background: linear-gradient(160deg, var(--green-vivid-1) 0%, var(--green-vivid-2) 100%); }
  .card-inner.want-3 { background: linear-gradient(160deg, var(--blue-vivid-1) 0%, var(--blue-vivid-2) 100%); }
  /* 「自発的にやりたい」ランクだけ、虹色に揺らめくキラカード風の光沢を重ねる */
  .card-inner.want-3::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      rgba(255,80,180,0.30) 0%,
      rgba(255,210,60,0.30) 20%,
      rgba(80,255,170,0.30) 40%,
      rgba(60,190,255,0.30) 60%,
      rgba(190,90,255,0.30) 80%,
      rgba(255,80,180,0.30) 100%);
    background-size: 260% 260%;
    mix-blend-mode: overlay;
    pointer-events: none;
    animation: kiraShift 5s ease-in-out infinite;
  }
  @keyframes kiraShift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  /* ===== 「自発的にやりたい」が出た時の、SSR風の派手な演出(星が弾け飛ぶだけのシンプルな構成) ===== */
  .ssr-burst {
    position: absolute; inset: -30px;
    pointer-events: none !important; z-index: 110; /* 星は一瞬の演出なので、前面カード(100)より手前に出して良い */
  }
  .ssr-burst * { pointer-events: none !important; }
  /* 中心から星形の粒子が四方八方へ弾け飛ぶ(--dx/--dyは各粒子ごとにJSで設定) */
  .ssr-sparkle {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    margin-left: -7px; margin-top: -7px;
    background: conic-gradient(from 0deg, #fff, #ffe27a, #fff, #7ad2ff, #fff);
    clip-path: polygon(50% 0%, 63% 38%, 100% 50%, 63% 62%, 50% 100%, 37% 62%, 0% 50%, 37% 38%);
    opacity: 0;
    animation: ssrSparkleBurst 0.85s cubic-bezier(0.15, 0.7, 0.25, 1) forwards;
  }
  @keyframes ssrSparkleBurst {
    0% { opacity: 0; transform: translate(0, 0) scale(0) rotate(0deg); }
    22% { opacity: 1; transform: translate(calc(var(--dx) * 0.3), calc(var(--dy) * 0.3)) scale(1.2) rotate(70deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(200deg); }
  }
  /* SSR演出と同時に、カード本体も少し派手に登場させる */
  .card.ssr-entrance { animation: ssrCardEntrance 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  @keyframes ssrCardEntrance {
    0% { transform: scale(0.55) rotate(-10deg); opacity: 0; }
    55% { transform: scale(1.06) rotate(3deg); opacity: 1; }
    80% { transform: scale(0.98) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .card .top-row { display:flex; justify-content:space-between; align-items:center; font-size:11px; }

  /* ===== ポイント使用(ガチャ)時の演出:期待感を煽る → 当たり(SSR演出)/外れ、の3段構成 =====
     光は「最前面カードと、その裏の2枚目の間」あたりに、ぼんやりとにじむように置く。
     めくり動作が終わるまでは同じ光の要素を維持し、結果が出た瞬間に
     ・当たり:瞬時に消えて星の演出へ ・外れ:ゆっくり収束して消える、という分岐にする */
  .gacha-glow-base {
    position: absolute; inset: -16px; /* カード全体を一回り大きく覆う、輪郭に沿った光る面にする */
    pointer-events: none !important; z-index: 50; /* 控え(最大20程度)より上、前面カード(100)より下に収める */
    border-radius: 30px; /* カード自体の角丸(18px)より少し大きめに */
    background: rgba(255, 215, 90, 0.22);
    /* filter:blurは一部のモバイルブラウザでpointer-events:noneと組み合わせた際に
       タップを正しく透過しない癖があるため使わず、box-shadowのぼかしで柔らかい光を作る */
    box-shadow:
      0 0 50px 16px rgba(255, 215, 90, 0.45),
      inset 0 0 45px 12px rgba(255, 215, 90, 0.32);
  }
  .gacha-pending { animation: gachaPulse 2.55s ease-in-out infinite; } /* 元の1/3程度の速度に */
  @keyframes gachaPulse {
    0%, 100% { transform: scale(0.97); opacity: 0.65; }
    50% { transform: scale(1.04); opacity: 1; }
  }
  .gacha-lose-collapse { animation: gachaLoseCollapse 0.9s ease-in forwards; }
  @keyframes gachaLoseCollapse {
    0% {
      transform: scale(1); opacity: 0.9;
      background: rgba(255, 215, 90, 0.22);
      box-shadow: 0 0 50px 16px rgba(255, 215, 90, 0.45), inset 0 0 45px 12px rgba(255, 215, 90, 0.32);
    }
    100% {
      transform: scale(0.15); opacity: 0;
      background: rgba(150, 150, 150, 0.22);
      box-shadow: 0 0 50px 16px rgba(150, 150, 150, 0.35), inset 0 0 45px 12px rgba(150, 150, 150, 0.22);
    }
  }

  .card-inner.want-0 .top-row, .card-inner.want-0 ~ .icon-action-row, .card-inner.want-0 .center p { color: var(--red-text); }
  .card-inner.want-1 .top-row, .card-inner.want-1 ~ .icon-action-row, .card-inner.want-1 .center p { color: var(--amber-text); }
  .card-inner.want-2 .top-row, .card-inner.want-2 ~ .icon-action-row, .card-inner.want-2 .center p { color: var(--green-text); }
  .card-inner.want-3 .top-row, .card-inner.want-3 ~ .icon-action-row, .card-inner.want-3 .center p { color: var(--blue-text); }
  .card .top-row .actions-mini { display:flex; gap:8px; }
  .card .top-row .top-row-left { display:flex; align-items:center; gap:10px; min-width:0; }
  .card .top-row .loc-span { display:flex; align-items:center; gap:4px; opacity:0.7; flex-shrink:0; }
  .step-dots { display:flex; align-items:center; gap:5px; flex-shrink:0; color: var(--text-secondary); }
  .step-dot { width:7px; height:7px; border-radius:50%; box-sizing:border-box; }
  .step-dot.done { background: currentColor; opacity:0.85; }
  .step-dot.current { width:10px; height:10px; background:transparent; border:2px solid currentColor; opacity:1; }
  .step-dot.future { background:transparent; border:1.3px solid currentColor; opacity:0.35; }
  .card .top-row button.icon-btn {
    background:none; border:none; cursor:pointer; color:inherit; opacity:0.6; padding:2px;
    display:flex; align-items:center; justify-content:center;
  }
  .card .top-row button.icon-btn:hover { opacity:1; }
  .card .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .card .center p:first-child {
    font-family: "RocknRoll One", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 21px; font-weight: 400; margin: 0 0 10px; line-height:1.5;
    letter-spacing: 0.12em;
    text-shadow: 1px 2px 3px rgba(0,0,0,0.35);
    white-space: pre-wrap;
  }
  .card .timer { margin-top:0; white-space: nowrap; }
  .card .timer-count { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .card .timer-total { font-size: 11px; font-weight: 500; opacity: 0.6; font-variant-numeric: tabular-nums; margin-left: 2px; }
  /* 時間タブ:card-innerの白い縁の下辺と、タブ自身の下辺がぴったり接するように配置する。
     card-innerの外(card自身の子)に置くことで、白い縁の境界線をまたいで乗る見た目になる */
  .card .time-tab {
    position: absolute;
    left: 50%; bottom: 64px; /* card-innerのbottom(64px)と同じ基準で、下辺をぴったり揃える */
    transform: translateX(-50%);
    width: max-content; /* 内容の幅に合わせて確実にサイズを決める(ブラウザ間の揺れを避ける) */
    white-space: nowrap; /* 分母の時間が2行目に折り返されないよう、確実に1行にする */
    background: rgba(255,255,255,0.96);
    border-radius: 10px 10px 0 0;
    padding: 3px 16px 2px;
    z-index: 3;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.14);
    color: #333; /* 白背景の上に乗るため、want別の色ではなく独立した濃いグレーで統一する */
    pointer-events: none;
  }
  .card .icon-action-row {
    position:absolute; left:0; right:0; bottom: 10px;
    display:flex; gap:14px; justify-content:center; align-items:center; z-index:2;
  }
  .card .icon-action-btn {
    width:48px; height:48px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--border-strong); background: var(--surface); color: var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .card .icon-action-btn:hover { background: var(--surface-2); }
  .card .icon-action-btn:active { transform: scale(0.94); }

  .empty-msg { text-align:center; color: var(--text-secondary); font-size:14px; padding: 60px 0; }

  /* タスク一覧画面 */
  .task-list-group-header {
    font-size: 11px; font-weight: 700; color: var(--text-secondary); margin: 14px 0 4px;
  }
  .task-list-group-header:first-child { margin-top: 0; }
  .task-list-row {
    display:flex; align-items:center; gap:8px; padding: 9px 4px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .task-list-row:hover { background: var(--surface-2); }
  .task-list-row.indent { padding-left: 22px; }
  .task-list-row .tl-want-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }
  .task-list-row .tl-title {
    flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .task-list-row .tl-loc {
    font-size:11px; color: var(--text-muted); flex-shrink:0; max-width:90px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .task-list-row .tl-title-input {
    flex:1; min-width:0; font-size:14px; padding:2px 4px;
    border:1px solid var(--border-strong); border-radius:4px; box-sizing:border-box;
  }
  .task-list-row .tl-del-btn {
    flex-shrink:0; width:24px; height:24px; border:1px solid var(--border);
    border-radius:6px; background: var(--surface); color: var(--red-text);
    cursor:pointer; font-size:13px; line-height:1; padding:0;
  }

  /* 新規作成ボタン */
  .fab {
    position: fixed; right: calc(24px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
    width: 54px; height:54px; border-radius:50%;
    background: var(--accent); color: var(--accent-text); border:none;
    font-size: 26px; cursor:pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    display:flex; align-items:center; justify-content:center;
  }
  .fab.fab-points {
    font-size: 15px; font-weight:700;
  }
  .fab.fab-list {
    right: calc(24px + 54px + 12px + env(safe-area-inset-right));
  }
  .fab.fab-points-far {
    right: calc(24px + 54px + 12px + 54px + 12px + env(safe-area-inset-right));
  }
  .fab.fab-points:disabled { opacity: 0.4; cursor: default; }
  /* ガチャの結果待ち(次のスキップ・完了まで保留中)の間、ボタン自体も分かるように控えめに脈動させる */
  .fab.fab-points.gacha-armed {
    animation: gachaArmedPulse 0.9s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(255,215,90,0.5);
  }
  @keyframes gachaArmedPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,215,90,0.35); }
    50% { box-shadow: 0 0 0 5px rgba(255,215,90,0.6); }
  }
  .fab.fab-points.shake { animation: pointsShake 0.4s ease; }
  .fab.fab-points.shake-fail { animation: pointsShakeFail 0.35s ease; background: var(--red-border); }
  @keyframes pointsShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-4deg); }
    40% { transform: translateX(4px) rotate(4deg); }
    60% { transform: translateX(-3px) rotate(-3deg); }
    80% { transform: translateX(3px) rotate(3deg); }
  }
  @keyframes pointsShakeFail {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
  /* 他に切り替えられるカードが無い時、スキップ操作に反応するだけの振動(色は変えない) */
  .card.no-alt-shake { animation: noAltShake 0.35s ease; }
  @keyframes noAltShake {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 0) rotate(-2deg); }
    40% { transform: translate(5px, 0) rotate(2deg); }
    60% { transform: translate(-4px, 0) rotate(-1.5deg); }
    80% { transform: translate(4px, 0) rotate(1.5deg); }
  }

  /* オーバーレイ(新規作成/編集) */
  .overlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.4);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index: 50;
    perspective: 1200px;
  }
  .overlay.open { display:flex; }
  /* 確認ダイアログは、他のどのオーバーレイの上からでも呼び出されうるので、常に最前面に出す */
  #confirmOverlay { z-index: 60; }
  .sheet {
    position: relative;
    width:100%; max-width: 340px; background: var(--surface); border-radius:16px;
    border:1px solid var(--border); padding: 22px; max-height: 85vh; overflow-y:auto;
    transform-style: preserve-3d; min-height: 0;
  }
  /* .sheet-clipを持つシートは、スクロールバーが角丸を突き破らないよう、
     外側(クリップのみ)と内側(実際にスクロールする領域)を分離する */
  .sheet.sheet-clip {
    padding: 0; overflow: hidden; display: flex; flex-direction: column;
  }
  .sheet.sheet-clip .sheet-scroll {
    overflow-y: auto; padding: 22px; min-height: 0; flex: 1;
  }
  /* 編集モードの時だけ、めくっているカードの裏面サイズに統一する */
  .sheet.card-back {
    width: 280px; max-width: 280px; height: 400px; box-sizing: border-box;
    border-radius: 18px; border: 1px solid var(--border-strong);
  }
  .sheet.flip-in { animation: cardFlipIn 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
  .sheet.flip-out { animation: cardFlipOut 0.28s ease forwards; }
  @keyframes cardFlipIn {
    0% { transform: rotateY(-110deg); opacity: 0.2; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }
  @keyframes cardFlipOut {
    0% { transform: rotateY(0deg); opacity: 1; }
    100% { transform: rotateY(110deg); opacity: 0; }
  }
  .sheet h3 { margin:0 0 16px; font-size:16px; font-weight:600; }
  .field { margin-bottom: 14px; }
  .field label { font-size:12px; color: var(--text-secondary); display:block; margin-bottom:4px; }
  .field input[type=text], .field select {
    width:100%; height:36px; border-radius:8px; border:1px solid var(--border-strong);
    padding: 0 10px; font-size:16px; background: var(--surface);
  }
  .field textarea {
    width:100%; border-radius:8px; border:1px solid var(--border-strong);
    padding: 8px 10px; font-size:16px; background: var(--surface); line-height:1.4;
  }
  .want-select { display:flex; gap:6px; align-items:stretch; }
  .want-select button {
    flex:1 1 0; min-height:38px; font-size:11px; border-radius:8px; border:1px solid var(--border-strong);
    background: var(--surface); cursor:pointer; padding:2px; line-height:1.3;
  }
  .want-select button .want-btn-small { font-size:9.5px; white-space:nowrap; }
  .want-select button.want-3 { font-size:11px; }
  /* 通常(新規作成)時は1行表記、編集(裏返ったカードサイズ)時は2行の改行表記に切り替える */
  .want-select .wn-cardback { display:none; }
  .sheet.card-back .want-select .wn-normal { display:none; }
  .sheet.card-back .want-select .wn-cardback { display:inline; }
  .sheet.card-back .want-select button { font-size:11px; }
  .sheet.card-back .want-select button.want-1 .wn-cardback { font-size:9px; white-space:nowrap; }
  .want-select button.selected.want-0 { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
  .want-select button.selected.want-1 { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-text); }
  .want-select button.selected.want-2 { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
  .want-select button.selected.want-3 { background: var(--blue-bg); border-color: var(--blue-border); color: var(--blue-text); }
  .checkrow { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; }
  .sheet-actions { display:flex; gap:8px; margin-top:6px; }
  .sheet-actions button {
    flex:1; height:40px; border-radius:8px; font-size:14px; border:1px solid var(--border-strong);
    background: var(--surface); cursor:pointer;
  }
  .sheet-actions button.primary { background: var(--accent); color: var(--accent-text); border:none; }
  .sheet-actions button.danger { color: var(--red-text); border-color: var(--red-border); }
  /* 編集画面(#cardSheet)だけ、決定ボタンをスクロール範囲の外に出し、常に下部に固定表示する。
     どれだけ編集しても、毎回一番下までスクロールしてから押す必要がないようにする */
  .sheet-actions-fixed {
    margin-top: 0; padding: 12px 16px; flex-shrink: 0;
    border-top: 1px solid var(--border); background: var(--surface);
    gap: 6px;
  }
  /* 分解・削除ボタンが増えて4つ並ぶため、文字サイズを少し落として1行に収める */
  .sheet-actions-fixed button {
    font-size: 12.5px; padding: 0 4px; white-space: nowrap;
  }

  .hint { font-size: 11px; color: var(--text-muted); margin-top: -8px; margin-bottom: 14px; }
</style>
</head>

<script>
// ===== データ層(localStorage) =====
const STORAGE_KEY = 'shuffle_tasks_cards_v1';
const POINTS_KEY = 'shuffle_tasks_points_v1';
const LOC_KEY = 'shuffle_tasks_current_location_v1';

// ===== Dropbox連携(PKCE方式) =====
const DBX_LS = {
  appkey: 'shuffle_tasks_dbx_appkey',
  refresh: 'shuffle_tasks_dbx_refresh',
  verifier: 'shuffle_tasks_dbx_verifier',
  mode: 'shuffle_tasks_dbx_mode',
};
const DBX_FILE_PATH = '/shuffle-tasks-data.json';
let dbx = null;
let dbxAuth = null;
let dbxUploadTimer = null;

function currentUrl() {
  return location.href.split('?')[0].split('#')[0];
}

function isDropboxConnected() {
  return !!(localStorage.getItem(DBX_LS.appkey) && localStorage.getItem(DBX_LS.refresh));
}

async function initDropbox() {
  const appKey = localStorage.getItem(DBX_LS.appkey);
  const refresh = localStorage.getItem(DBX_LS.refresh);
  if (!appKey || !refresh || typeof Dropbox === 'undefined') return false;
  dbxAuth = new Dropbox.DropboxAuth({ clientId: appKey });
  dbxAuth.setRefreshToken(refresh);
  dbx = new Dropbox.Dropbox({ auth: dbxAuth });
  return true;
}

async function startDropboxAuth() {
  const input = document.getElementById('dbxAppKeyInput');
  const appKey = input.value.trim();
  if (!appKey) { setDbxMsg('App Keyを入力してください', true); return; }
  localStorage.setItem(DBX_LS.appkey, appKey);
  dbxAuth = new Dropbox.DropboxAuth({ clientId: appKey });
  const redirectUri = currentUrl();
  const authUrl = await dbxAuth.getAuthenticationUrl(redirectUri, undefined, 'code', 'offline', undefined, undefined, true);
  localStorage.setItem(DBX_LS.verifier, dbxAuth.codeVerifier);
  window.location.href = authUrl;
}

async function handleDropboxOAuthCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (!code) return false;
  history.replaceState({}, document.title, location.pathname);
  const appKey = localStorage.getItem(DBX_LS.appkey);
  const verifier = localStorage.getItem(DBX_LS.verifier);
  if (!appKey || !verifier) return false;
  dbxAuth = new Dropbox.DropboxAuth({ clientId: appKey });
  dbxAuth.codeVerifier = verifier;
  try {
    const res = await dbxAuth.getAccessTokenFromCode(currentUrl(), code);
    localStorage.setItem(DBX_LS.refresh, res.result.refresh_token);
    localStorage.removeItem(DBX_LS.verifier);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function disconnectDropbox() {
  customConfirm('Dropboxとの連携を解除しますか?データはDropbox上に残りますが、このデバイスからは同期されなくなります。', () => {
    [DBX_LS.appkey, DBX_LS.refresh, DBX_LS.verifier].forEach(k => localStorage.removeItem(k));
    dbx = null; dbxAuth = null;
    renderSettingsUI();
  });
}

async function uploadToDropbox() {
  if (!dbx) return;
  const payload = JSON.stringify({
    cards, points, locations: LOCATIONS,
    currentLocation, // 他端末でも同じ「今いる場所」が開けるように
    currentCardId: currentCard ? currentCard.id : null, // 他端末でも同じカードが前面に来るように
    currentCardTimerEndAt: currentCard ? timerEndAt : null, // 他端末でも、進んだ分だけ減った状態でタイマーが始まるように
    savedAt: Date.now(),
  });
  try {
    await dbx.filesUpload({ path: DBX_FILE_PATH, contents: payload, mode: { '.tag': 'overwrite' } });
    setDbxMsg('同期しました');
  } catch (e) {
    console.error(e);
    setDbxMsg('同期に失敗しました: ' + describeDropboxError(e), true);
  }
}

function describeDropboxError(e) {
  try {
    // Dropbox SDKのエラーは e.error.error_summary や e.message に詳細が入っていることが多い
    if (e && e.error) {
      if (typeof e.error === 'string') return e.error;
      if (e.error.error_summary) return e.error.error_summary;
      if (e.error['.tag']) return e.error['.tag'];
    }
    if (e && e.status) return `status ${e.status}`;
    if (e && e.message) return e.message;
  } catch (_) {}
  return '不明なエラー';
}

function scheduleDropboxUpload() {
  if (!isDropboxConnected() || !dbx) return;
  clearTimeout(dbxUploadTimer);
  dbxUploadTimer = setTimeout(uploadToDropbox, 800);
}

// アプリを閉じる・タブを切り替える・バックグラウンドに回る瞬間、
// 待たずに即座にアップロードする(保存し忘れによる巻き戻りを防ぐ)
function flushDropboxUpload() {
  if (!isDropboxConnected() || !dbx) return;
  if (dbxUploadTimer) {
    clearTimeout(dbxUploadTimer);
    dbxUploadTimer = null;
    uploadToDropbox();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushDropboxUpload();
  if (document.visibilityState === 'visible') autoSyncOnReturn();
});
window.addEventListener('pagehide', flushDropboxUpload);

// ダウンロードしてきたデータ(cards/points/locations/currentLocation/currentCardId)を、
// 手元の状態に反映する共通処理。「タブに戻ってきた時」「アプリを新規に開いた時」の両方で使う
function applyRemoteData(remote) {
  if (!remote) return;
  if (Array.isArray(remote.cards)) { cards = remote.cards; localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
  if (remote.points) {
    // 他端末のデータが万一おかしな形(欠損・NaN等)でも、カウントダウンが壊れたまま
    // 固まってしまわないよう、安全な値に補正してから採用する
    const rp = remote.points;
    points = {
      task: (typeof rp.task === 'number' && isFinite(rp.task)) ? rp.task : 0,
      time: (typeof rp.time === 'number' && isFinite(rp.time)) ? rp.time : 0,
      lastTick: (typeof rp.lastTick === 'number' && isFinite(rp.lastTick)) ? rp.lastTick : Date.now(),
    };
    localStorage.setItem(POINTS_KEY, JSON.stringify(points));
  }
  if (Array.isArray(remote.locations)) { LOCATIONS = remote.locations; localStorage.setItem(LOCATIONS_KEY, JSON.stringify(LOCATIONS)); }

  // 他端末で最後にいた「今いる場所」があれば、それに合わせる
  let locationChanged = false;
  if (typeof remote.currentLocation === 'string' && remote.currentLocation !== currentLocation) {
    currentLocation = remote.currentLocation;
    localStorage.setItem(LOC_KEY, currentLocation);
    const labelEl = document.getElementById('locationLabel');
    if (labelEl) labelEl.textContent = currentLocation ? `今いる場所:${currentLocation}` : '今いる場所:指定なし';
    locationChanged = true;
  }

  renderLocationMenu();
  populateLocationSelect();

  const remoteCardId = remote.currentCardId || null;
  const localCardId = currentCard ? currentCard.id : null;
  const remoteCardStillExists = remoteCardId && cards.some(c => c.id === remoteCardId);

  if (locationChanged || (remoteCardId && remoteCardId !== localCardId)) {
    // 他端末で進んでいた分だけ減った状態でタイマーが始まるよう、切り替える前に終了予定時刻を仕込んでおく。
    // drawCard内のclearTimerで消えてしまわないよう、専用の一時変数(pendingTimerSeed)を使う
    if (remoteCardStillExists && typeof remote.currentCardTimerEndAt === 'number' && isFinite(remote.currentCardTimerEndAt)) {
      pendingTimerSeed = { cardId: remoteCardId, endAt: remote.currentCardTimerEndAt };
    }
    // 場所が変わった、または他端末で違うカードを見ていた場合は、それに合わせて切り替える
    drawCard(remoteCardStillExists ? cards.find(c => c.id === remoteCardId) : undefined);
  } else {
    // 今表示中のカードがまだ存在するなら、表示やタイマーには一切触れない
    const stillExists = localCardId && cards.some(c => c.id === localCardId);
    if (!stillExists) drawCard();
  }
}

let autoSyncInFlight = false;

async function downloadFromDropbox() {
  if (!dbx) return null;
  try {
    const res = await dbx.filesDownload({ path: DBX_FILE_PATH });
    const text = await res.result.fileBlob.text();
    return JSON.parse(text);
  } catch (e) {
    const desc = describeDropboxError(e);
    // ファイルがまだ存在しない(初回連携時など)は静かに無視する。それ以外は表示する
    if (!/not_found|path\/not_found/i.test(desc)) {

const TIME_OPTIONS = [15, 30, 45, 60, 90, 120, 150, 180, 210, 240];
function formatMinutes(m) {
  if (m < 60) return `${m}分`;
  const h = Math.floor(m / 60), rem = m % 60;
  return rem === 0 ? `${h}時間` : `${h}時間${rem}分`;
}
function formatClock(totalMinutes) {
  // 分を2桁固定にして、カウントダウン中も桁数がブレないようにする(例:09:58)
  const m = Math.floor(totalMinutes);
  const s = Math.round((totalMinutes - m) * 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function nearestTimeOption(v) {
  if (!v) return TIME_OPTIONS[0];
  let best = TIME_OPTIONS[0];
  let bestDiff = Math.abs(v - best);
  for (const t of TIME_OPTIONS) {
    const diff = Math.abs(v - t);
    if (diff < bestDiff) { best = t; bestDiff = diff; }
  }
  return best;
}
function populateTimeSelect(selectEl, currentValue) {
  selectEl.innerHTML = '';
  let opts = [...TIME_OPTIONS];
  if (currentValue && !opts.includes(currentValue)) {
    opts.push(currentValue);
    opts.sort((a,b) => a - b);
  }
  opts.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = formatMinutes(m);
    selectEl.appendChild(opt);
  });
  selectEl.value = currentValue || TIME_OPTIONS[0];
}

function spendPoints(cost) {
  let remaining = cost;
  const fromTask = Math.min(points.task, remaining);
  points.task -= fromTask;
  remaining -= fromTask;
  if (remaining > 0) {
    const fromTime = Math.min(points.time, remaining);
    points.time -= fromTime;
  }
  savePoints(points);
}

const GACHA_WIN_CHANCE = 0.65; // ポイント使用時、当選確率をここまで引き上げる(それでも外れることがある)

// ポイントを消費して、レア(自発的にやりたい)を引き当てる確率を大きく引き上げる。
// あくまで「確率を上げる」だけで、結果を直接確定させない(外れることもある)。
// 外れてもポイントは戻らない
let pendingGacha = null; // 保留中のガチャ(次にスキップ・完了を押すまで結果を持ち越す)

function useGachaPoints() {
  if (totalPoints() < GACHA_COST) return; // ボタン自体がdisabledになるので通常ここには来ない
  if (pendingGacha) return; // 既に結果待ちのガチャがある間は、二重に受け付けない

  const now = Date.now();
  // まず、そもそも「賭けの対象」になりうるレアタスクが存在するか確認しておく(今いる場所限定)
  const idxInQueue = lookaheadQueue.findIndex((c, i) => i > 0 && c.want === 3);
  const excludeIds = [currentCard ? currentCard.id : null, ...lookaheadQueue.map(d => d.id)].filter(Boolean);
  const locPool = locationEligiblePool(cards);
  const freshCandidate = idxInQueue > 0 ? null : locPool.find(c => c.want === 3 && !excludeIds.includes(c.id) &&
    !isChildBlocked(c) && (!c.availableAfter || c.availableAfter <= now));

  if (idxInQueue <= 0 && !freshCandidate) {
    // そもそも呼び込める対象が無い場合は、賭けとして成立しないのでポイントは消費しない
    playPointsSpendFeedback(false);
    return;
  }

  // ここから先は「賭け」なので、結果に関わらずポイントを消費する
  spendPoints(GACHA_COST);
  playPointsSpendFeedback(true); // 使ったこと自体への反応として、ボタンを一度揺らす

  const stack = document.querySelector('#stackArea .stack');
  const glow = playGachaAnticipation(stack);
  // 結果はすぐには出さず、光を点したまま「次にスキップ・完了を押すまで」保留しておく
  pendingGacha = { glow };
  renderPoints(); // pendingGachaを設定した後で呼び、ボタンの無効化にも反映させる
  const btn = document.getElementById('pointsUseBtn');
  if (btn) btn.classList.add('gacha-armed'); // 保留中であることが分かるよう、ボタン自体もそれと分かる見た目にする
}

// 保留中のガチャがあれば、次のカード操作(スキップ・完了)のタイミングで結果を出す。
// 光の演出は、この瞬間まで維持され続ける
// 保留中のガチャがあれば、次のカード操作(スキップ・完了)のタイミングで結果を出す。
// 光の演出は、この瞬間まで維持され続ける。
// 戻り値:演出が最後まで再生されるのに必要なミリ秒(呼び出し側は、この間だけ全体再描画を遅らせる)
function resolvePendingGachaIfAny() {
  if (!pendingGacha) return 0;
  const { glow } = pendingGacha;
  pendingGacha = null;
  const btn = document.getElementById('pointsUseBtn');
  if (btn) btn.classList.remove('gacha-armed');
  try {
    const stack = document.querySelector('#stackArea .stack');
    const won = Math.random() < GACHA_WIN_CHANCE;
    const applied = won ? applyGachaWin(stack) : false;
    if (applied) {
      // 当たり:光は瞬時に消えて、そのまま星の演出につながる(星の演出は最大1.2秒ほど)
      removeGachaGlowInstant(glow);
      playGachaWinEffect(stack);
      playPointsSpendFeedback(true);
      return 1250;
    } else {
      // 外れ:同じ光がゆっくり収束して消える(収束アニメーションは0.9秒)
      playGachaLoseEffect(glow);
      playPointsSpendFeedback(false);
      return 950;
    }
  } catch (e) {
    console.error('ガチャの結果反映でエラー:', e);
    return 0;
  }
}

// 当選時:控えの中にいれば先頭へ、いなければcards全体から新たに呼び込む(これまでの差し込みロジック)。
// 演出待ちの間に状況が変わっている可能性があるため、呼ばれた時点の最新状態で改めて判定する。
// 反映できたかどうかをboolで返す(できなければ、呼び出し側で外れ扱いにする)
function applyGachaWin(stack) {
  try {
    const now = Date.now();
    const idxInQueue = lookaheadQueue.findIndex((c, i) => i > 0 && c.want === 3);

    if (idxInQueue > 0 && ghostFaces[0] && ghostFaces[idxInQueue]) {
      const oldHeadFace = ghostFaces[0];
      const targetFace = ghostFaces[idxInQueue];

      oldHeadFace.el.classList.add('masked');
      oldHeadFace.el.style.transform = `translate(${layerOffset(idxInQueue)}px, ${layerOffset(idxInQueue)}px)`;

      targetFace.el.classList.remove('masked');
      targetFace.el.style.transform = 'translate(8px, 8px)';

      ghostFaces[0] = targetFace;
      ghostFaces[idxInQueue] = oldHeadFace;
      lookaheadQueue[0] = ghostFaces[0].data;
      lookaheadQueue[idxInQueue] = ghostFaces[idxInQueue].data;
      nextCard = lookaheadQueue[0];

      const remainingTotal = Math.min(THICKNESS_CAP, Math.max(0, cards.length - 1));
      ghostFaces.forEach((gf, i) => { gf.el.style.zIndex = String(remainingTotal - i); });
      return true;
    }

    const excludeIds = [currentCard ? currentCard.id : null, ...lookaheadQueue.map(d => d.id)].filter(Boolean);
    const locPool = locationEligiblePool(cards);
    const freshCandidate = locPool.find(c => c.want === 3 && !excludeIds.includes(c.id) &&
      !isChildBlocked(c) && (!c.availableAfter || c.availableAfter <= now));

    if (freshCandidate && stack) {
      if (ghostFaces.length > 0) {
        ghostFaces[0].el.remove();
        ghostFaces.shift();
        lookaheadQueue.shift();
      }
      const face = buildCardFace(freshCandidate);
      face.el.classList.add('peek'); // 先頭に来るのでマスクしない
      face.el.style.transform = 'translate(8px, 8px)';
      face.el.style.pointerEvents = 'none';
      stack.appendChild(face.el);
      ghostFaces.unshift({ data: freshCandidate, ...face });
      lookaheadQueue.unshift(freshCandidate);
      nextCard = freshCandidate;

      const remainingTotal = Math.min(THICKNESS_CAP, Math.max(0, cards.length - 1));
      ghostFaces.forEach((gf, i) => { gf.el.style.zIndex = String(remainingTotal - i); });
      return true;
    }

    return false;
  } catch (e) {
    console.error('ガチャ当選の反映でエラー:', e);
    return false;
  }
}

// 演出は全て「あればなお良い」付加要素なので、丸ごとtry-catchで保護し、本体の動作には影響させない
function playGachaAnticipation(stack) {
  try {
    if (!stack) return null;

}

// 外れ:同じ光の要素を、脈動から「ゆっくり収束して消える」アニメーションに切り替える

        scheduleDropboxUpload(); // 他端末で「今いる場所」も揃うように同期する
        document.getElementById('locationLabel').textContent = `今いる場所:${loc}`;
        menu.classList.remove('open');
        pendingShuffleAnim = true; // 場所切り替え時もデッキがシャッフルされる演出を出す
        drawCard();
      }, 250);
    };
    row.appendChild(label);

    if (val !== '') {
      row.dataset.loc = loc;
      const locIdx = LOCATIONS.indexOf(loc); // LOCATIONS配列上の実インデックス

      const commitRename = (newName) => {
        const trimmed = (newName || '').trim();
        if (!trimmed || (trimmed !== loc && LOCATIONS.includes(trimmed))) {
          renderLocationMenu();
          document.getElementById('locationMenu').classList.add('open');
          return;
        }
        LOCATIONS[locIdx] = trimmed;
        saveLocations(LOCATIONS);
        cards = cards.map(c => c.location === loc ? {...c, location: trimmed} : c);
        saveCards(cards);
        if (currentLocation === loc) {
          currentLocation = trimmed;
          localStorage.setItem(LOC_KEY, currentLocation);
          document.getElementById('locationLabel').textContent = `今いる場所:${trimmed}`;
        }
        renderLocationMenu();
        populateLocationSelect();
        document.getElementById('locationMenu').classList.add('open');
        drawCard();
      };

      const startRenameUI = () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = loc;
        input.style.flex = '1';
        input.style.font = 'inherit';
        input.style.fontSize = '16px';
        input.style.border = '1px solid var(--border-strong)';
        input.style.borderRadius = '4px';
        input.style.padding = '2px 4px';
        input.style.width = '100%';
        row.replaceChild(input, label);
        input.focus();
        input.select();
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          commitRename(input.value);
        };
        input.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); finish(); }
          if (ev.key === 'Escape') { done = true; renderLocationMenu(); document.getElementById('locationMenu').classList.add('open'); }
        });
        input.addEventListener('blur', finish);
      };

      label.ondblclick = (e) => {
        e.stopPropagation();
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        startRenameUI();
      };

      // タッチ操作向け:長押しでリネーム開始
      label.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') return;
        touchStartX = e.clientX; touchStartY = e.clientY;
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          longPressTriggered = true;
          if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
          startRenameUI();
        }, 500);
      });
      label.addEventListener('pointermove', (e) => {
        if (!longPressTimer) return;
        if (Math.abs(e.clientX - touchStartX) > 10 || Math.abs(e.clientY - touchStartY) > 10) {
          clearTimeout(longPressTimer); longPressTimer = null;
        }
      });
      const cancelLongPress = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
      label.addEventListener('pointerup', cancelLongPress);
      label.addEventListener('pointercancel', cancelLongPress);
      label.addEventListener('pointerleave', cancelLongPress);

      const mkBtn = (text, title, onClick) => {
        const b = document.createElement('span');
        b.textContent = text;
        b.title = title;
        b.style.cursor = 'pointer';
        b.style.opacity = '0.5';
        b.style.fontSize = '12px';
        b.style.padding = '0 3px';
        b.onclick = (e) => { e.stopPropagation(); onClick(); };
        return b;
      };

      // ドラッグハンドル(並べ替え)
      const handle = document.createElement('span');
      handle.textContent = '⠿';
      handle.title = 'ドラッグで並べ替え';
      handle.style.cursor = 'grab';
      handle.style.opacity = '0.5';
      handle.style.fontSize = '14px';
      handle.style.padding = '0 4px';
      handle.style.touchAction = 'none';
      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);
        let dragOrder = [...LOCATIONS];
        row.style.opacity = '0.4';
        const menuEl = document.getElementById('locationMenu');

        const onMove = (ev) => {
          const elem = document.elementFromPoint(ev.clientX, ev.clientY);
          const targetRow = elem && elem.closest ? elem.closest('[data-loc]') : null;
          if (targetRow && targetRow !== row && menuEl.contains(targetRow)) {
            const fromIdx = dragOrder.indexOf(loc);
            const toIdx = dragOrder.indexOf(targetRow.dataset.loc);
            if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
              dragOrder.splice(fromIdx, 1);
              dragOrder.splice(toIdx, 0, loc);
              if (fromIdx < toIdx) {
                menuEl.insertBefore(row, targetRow.nextSibling);
              } else {
                menuEl.insertBefore(row, targetRow);
              }
            }
          }
        };
        const onUp = (ev) => {
          handle.releasePointerCapture(ev.pointerId);
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          row.style.opacity = '';
          LOCATIONS = dragOrder;
          saveLocations(LOCATIONS);
          renderLocationMenu();
          document.getElementById('locationMenu').classList.add('open');
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
      });

      const del = mkBtn('×', '削除', () => {
        customConfirm(`「${loc}」を削除しますか?この場所を使っているカードは「指定なし」に変わります。`, () => {
          LOCATIONS = LOCATIONS.filter(l => l !== loc);
          saveLocations(LOCATIONS);
          cards = cards.map(c => c.location === loc ? {...c, location:''} : c);
          saveCards(cards);
          if (currentLocation === loc) {
            currentLocation = '';
            localStorage.setItem(LOC_KEY, '');
            document.getElementById('locationLabel').textContent = '今いる場所:指定なし';
          }
          renderLocationMenu();
          populateLocationSelect();
          drawCard();
        });
      });

      row.appendChild(handle);
      row.appendChild(del);
    }
    menu.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.textContent = '+ 新しい場所を追加';
  addRow.style.color = 'var(--text-secondary)';
  addRow.style.cursor = 'pointer';
  addRow.onclick = (e) => {
    e.stopPropagation();
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '場所の名前(例:電車)';
    input.style.width = '100%';
    input.style.fontSize = '16px';
    input.style.border = '1px solid var(--border-strong)';
    input.style.borderRadius = '4px';
    input.style.padding = '4px 6px';
    input.style.boxSizing = 'border-box';
    menu.replaceChild(input, addRow);
    input.focus();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      const trimmed = input.value.trim();
      if (trimmed && !LOCATIONS.includes(trimmed)) {
        LOCATIONS.push(trimmed);
        saveLocations(LOCATIONS);
        populateLocationSelect();
      }
      renderLocationMenu();
      document.getElementById('locationMenu').classList.add('open');
    };
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(); }
      if (ev.key === 'Escape') { done = true; renderLocationMenu(); document.getElementById('locationMenu').classList.add('open'); }
    });
    input.addEventListener('blur', finish);
  };
  menu.appendChild(addRow);
}
document.getElementById('locationPill').onclick = () => {
  document.getElementById('locationMenu').classList.toggle('open');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('.location-wrap')) {
    document.getElementById('locationMenu').classList.remove('open');
  }
});

// ===== カード選択ロジック =====
function pickCard(excludeIds, allowFallback) {
  const excludeSet = excludeIds == null ? null : new Set(Array.isArray(excludeIds) ? excludeIds : [excludeIds]);
  const now = Date.now();
  const hardAlive = cards.filter(c => !isChildBlocked(c) && (!c.availableAfter || c.availableAfter <= now));
  let alive = hardAlive.filter(c => !excludeSet || !excludeSet.has(c.id));
  // 「直前にスキップしたカードを避ける」等のソフトな除外が原因で候補がゼロになる場合、
  // 呼び出し側が明示的に許可していれば除外を無視して救済する(先読みキューの重複防止には使わない)
  if (alive.length === 0 && allowFallback) alive = hardAlive;
  if (alive.length === 0) return null;

  // 1. 現在地に紐づくカードがあれば優先(順序があれば順序順、なければ同ランク内ランダム)。
  // 現在地を指定している場合、該当が無ければ「場所指定なし」のカードだけに絞る(他の場所専用のカードは出さない)。
  // 「今いる場所:指定なし」の時は、そもそも場所での絞り込み自体を行わない
  const locMatches = alive.filter(c => currentLocation && c.location === currentLocation);
  const usePool = locMatches.length > 0
    ? locMatches
    : (currentLocation ? alive.filter(c => !c.location) : alive);

  // 順序付きカード(分解タスク)があれば優先する。ただし「order」の数字は同じ系列(parentId)の
  // 中でしか意味を持たないため、系列ごとに「今その中で一番手前にある手順」だけを代表として立て、
  // 系列同士の間では(数字の大小ではなく)公平にランダムで選ぶ
  const seqHeadsMap = new Map();
  usePool.forEach(c => {
    if (c.order == null || c.parentId == null) return;
    const cur = seqHeadsMap.get(c.parentId);
    if (!cur || c.order < cur.order) seqHeadsMap.set(c.parentId, c);
  });
  const seqHeads = [...seqHeadsMap.values()];
  if (locMatches.length > 0 && seqHeads.length > 0) {
    return seqHeads[Math.floor(Math.random() * seqHeads.length)];
  }

  // 2. want重み。「自発的にやりたい」だけは固定重みではなく、
  //    「その時のプール内にある、レア以外の総重みに対する比率」で動的に計算する(目標3%)。
  //    非レアの残り枚数が少なくなるほど、目標比率自体もなだらかに下げる(終盤の急激な出やすさを緩和)。
  //    また、直前に出たレアと同じものは、他に候補があれば一時的に避ける(重複を防ぐ)
  const nonRareCards = usePool.filter(c => c.want !== 3);
  const rareCardsAll = usePool.filter(c => c.want === 3);
  const rareCardsPreferred = rareCardsAll.filter(c => c.id !== lastRareId);
  const rareCards = rareCardsPreferred.length > 0 ? rareCardsPreferred : rareCardsAll;

  const nonRareWeightSum = nonRareCards.reduce((s, c) => s + (BASE_WEIGHT[c.want] ?? 1), 0);

  const weighted = [];
  nonRareCards.forEach(c => weighted.push({ card: c, w: BASE_WEIGHT[c.want] ?? 1 }));

  if (rareCards.length > 0) {
    if (nonRareWeightSum > 0) {
      const perRareWeight = (nonRareWeightSum * RARE_TARGET_RATIO) / rareCards.length;
      rareCards.forEach(c => weighted.push({ card: c, w: perRareWeight }));
    } else {
      // 非レアが1枚も無い(プールがレアだけ)場合は、比率計算が成立しないので均等な重みで扱う
      rareCards.forEach(c => weighted.push({ card: c, w: 1 }));
    }
  }

  const totalW = weighted.reduce((s,x)=>s+x.w,0);
  if (totalW <= 0) return usePool[0] || null;
  let r = Math.random() * totalW;
  for (const item of weighted) {
    r -= item.w;
    if (r <= 0) return item.card;
  }
  return weighted[weighted.length - 1] ? weighted[weighted.length - 1].card : null;
}

// pickCardと同じ場所の絞り込みルールを、任意のカード集合に適用する共通ヘルパー。
// (ガチャの候補探しなど、pickCard以外の場所でも同じ場所ルールを守るために使う)
function locationEligiblePool(pool) {
  if (!currentLocation) return pool; // 「指定なし」の時は絞り込み自体を行わない
  const exact = pool.filter(c => c.location === currentLocation);
  if (exact.length > 0) return exact;
  return pool.filter(c => !c.location); // 該当が無ければ「場所指定なし」のカードだけに絞る
}

function isChildBlocked(c) {
  // 親を持つ子タスクで、自分より小さいorderの兄弟が未完了なら出さない。
  // ただし「1日1回」等で完了後に複製され、翌日まで隠れているだけの兄弟(availableAfterが未来)は、
  // 今日はもう出す必要が無いので、ブロックしている扱いにはしない
  if (c.parentId == null || c.order == null) return false;
  const now = Date.now();
  const siblings = cards.filter(s => s.parentId === c.parentId && s.order < c.order &&
    (!s.availableAfter || s.availableAfter <= now));
  return siblings.length > 0;
}

// 控えの全枚数ぶん、本物のカードをあらかじめ重複なく先読みしておく
function buildLookaheadQueue(count, excludeIds) {
  const queue = [];
  // 「今のカードと同じものが、すぐ次(見えている1枚)に来ない」ことだけを保証すれば十分。
  // それより奥は全てマスクされていて中身が見えないので、同じカードが何度出てきても
  // 見た目には一切影響しない。むしろ厳密に重複を禁止すると、残り枚数が少ない時に
  // 毎回全カードを律儀に一巡させるだけの、不自然に決定的な並びになってしまう
  for (let i = 0; i < count; i++) {
    const picked = pickCard(excludeIds);
    if (!picked) break;
    queue.push(picked);
  }
  return queue;
}

// ===== カード表示 =====
function drawCard(forceCard) {
  // 場所の切り替えや新規作成など、drawCardが呼ばれる操作の直前に保留中のガチャがあれば、
  // 画面ごと作り直される前に、ここで結果を出しておく(でないと結果が宙に浮いたまま消えてしまう)
  resolvePendingGachaIfAny();
  clearTimer();
  tickTimePoints();
  renderPoints();
  currentCard = forceCard || pickCard();
  const remaining = currentCard ? Math.min(THICKNESS_CAP, Math.max(0, cards.length - 1)) : 0;
  const realCount = Math.min(THICKNESS_REAL_CAP, remaining);
  lookaheadQueue = currentCard ? buildLookaheadQueue(realCount, [currentCard.id]) : [];
  nextCard = lookaheadQueue[0] || null; // 互換のため維持
  renderStack();
  scheduleDropboxUpload(); // 他端末でも同じカードが前面に来るよう、選出結果を同期する
}

// 完了・スキップ後、あらかじめ確定していた次のカードをそのまま前面に昇格させる。
// ランダムな再抽選をしないことで、「控えにいたのと同じカードが繰り上がる」体験を保証する
function promoteNextCard() {
  // ガチャの結果は、繰り上がりアニメーションが始まる前(skipCard/completeCardの冒頭)で
  // 既に出し終えている。ここではその時に必要になった演出待ち時間だけを受け取る
  const gachaEffectDelayMs = pendingGachaEffectDelayMs;
  pendingGachaEffectDelayMs = 0;
  clearTimer();
  tickTimePoints();
  renderPoints();

  // 防御的クリーンアップ:先頭以外の控えも含めて、もはやcardsに実在しない・出せない
  // データを指しているものがあれば、幽霊化する前にDOMごと取り除く
  for (let i = ghostFaces.length - 1; i >= 0; i--) {
    const gf = ghostFaces[i];
    const stillExists = cards.some(c => c.id === gf.data.id) && !isChildBlocked(gf.data) &&
      (!gf.data.availableAfter || gf.data.availableAfter <= Date.now());
    if (!stillExists) {
      gf.el.remove();
      ghostFaces.splice(i, 1);
      lookaheadQueue.splice(i, 1);
    }
  }

  // 掃除した後、残った控えの位置とz-indexを新しいインデックスに合わせて再同期する
  if (ghostFaces.length > 0) {
    ghostFaces.forEach((gf, i) => {
      const offset = layerOffset(i);
      gf.el.style.transform = `translate(${offset}px, ${offset}px)`;
      gf.el.style.zIndex = String(ghostFaces.length - i);
    });
  }

  const headValid = ghostFaces.length > 0 && lookaheadQueue.length > 0 &&
    ghostFaces[0].data.id === lookaheadQueue[0].id &&
    cards.some(c => c.id === lookaheadQueue[0].id) &&
    !isChildBlocked(lookaheadQueue[0]) &&
    (!lookaheadQueue[0].availableAfter || lookaheadQueue[0].availableAfter <= Date.now());

  if (headValid) {
    // 先頭(ghostFaces[0])を作り直さずそのまま前面に昇格させる
    const promoted = ghostFaces[0];
    currentCard = promoted.data;

    promoted.el.classList.remove('peek', 'masked');
    promoted.el.style.pointerEvents = '';
    promoted.el.style.zIndex = '10';
    // transform\u306f\u65e2\u306bshiftGhostsForward\u3067(0,0)\u3078\u5411\u3051\u3066\u52d5\u304b\u3057\u59cb\u3081\u3066\u3044\u308b\u306e\u3067\u3001\u3053\u3053\u3067\u306f\u89e6\u3089\u306a\u3044
    promoted.editBtn.onclick = () => openEdit(promoted.data);
    promoted.doneBtn.onclick = () => completeCard(promoted.data);
    promoted.skipBtn.onclick = () => skipCard(promoted.data);
    if (promoted.decBtn) promoted.decBtn.onclick = () => openDecompose(promoted.data);

    frontFace = promoted;
    // renderStackと同様、控えのz-indexがデッキ枚数次第で10を超えうるため、
    // 繰り上がって前面になったカードにも、確実に上回る明示的なz-indexを設定しておく
    promoted.el.style.zIndex = '100';
    startTimer(promoted.countEl, promoted.data.time, promoted.data.id);
    if (promoted.data.want === 3) {
      lastRareId = promoted.data.id;
      promoted.el.classList.add('ssr-entrance');
      // このクラスが残り続けると、後でスキップ・完了時のアニメーション(to-back/fly-out)と
      // 衝突してanimationendが発火しなくなり、操作不能に陥るため、自分のアニメーション終了で必ず外す
      promoted.el.addEventListener('animationend', () => promoted.el.classList.remove('ssr-entrance'), { once: true });
      playSSREffect(document.querySelector('#stackArea .stack'));
    }

    // 残りのghostFacesは1つ繰り上がり(indexが1はマスクを外して公開する)、末尾に新しい先読みを追加する(本物の先読みはTHICKNESS_REAL_CAP枚まで)
    let restFaces = ghostFaces.slice(1);
    let restData = lookaheadQueue.slice(1);

    // 控えの中身は重複を許しているが、「今まさに前面になったカード」とだけは、
    // 画面上に同じものが同時に2枚見える形になってしまうため、ここだけは取り除いておく
    const dupIdx = restData.findIndex(d => d.id === currentCard.id);
    if (dupIdx !== -1) {
      restFaces[dupIdx].el.remove();
      restFaces.splice(dupIdx, 1);
      restData.splice(dupIdx, 1);
    }

    const remainingTotal = Math.min(THICKNESS_CAP, Math.max(0, cards.length - 1));
    const realCap = Math.min(THICKNESS_REAL_CAP, remainingTotal);
    // 新しく足す控えは、末尾の(マスクされた)位置に入るので、既存の控えメンバーと被っても見た目には影響しない。
    // 今のカードとだけ被らなければ十分
    const excludeIds = [currentCard.id];
    if (justSkippedId) excludeIds.push(justSkippedId);
    let newTailData = null;
    if (restFaces.length < realCap) {
      newTailData = pickCard(excludeIds);
    }

    const stack = document.querySelector('#stackArea .stack');
    if (newTailData && stack) {
      const face = buildCardFace(newTailData);
      const willBeIndexZero = restFaces.length === 0; // 追加した瞬間、先頭(次に繰り上がる位置)になるかどうか
      face.el.classList.add('peek');
      if (!willBeIndexZero) face.el.classList.add('masked');
      const offset = layerOffset(restFaces.length);
      face.el.style.transform = `translate(${offset}px, ${offset}px)`;
      face.el.style.zIndex = '1';
      face.el.style.pointerEvents = 'none';
      face.el.style.opacity = '0';
      stack.appendChild(face.el);
      requestAnimationFrame(() => {
        face.el.style.transition = 'opacity 0.25s ease';
        face.el.style.opacity = '1';
      });
      restFaces.push({ data: newTailData, ...face });
      restData.push(newTailData);
    }

    ghostFaces = restFaces;
    lookaheadQueue = restData;
    nextCard = lookaheadQueue[0] || null;
    // z-index(重なり順)と位置(オフセット)を、新しいインデックスに合わせて必ず再計算する
    // (重複削除で配列がズレることがあるため、古い値のまま放置しない)
    ghostFaces.forEach((gf, i) => {
      gf.el.style.zIndex = String(remainingTotal - i);
      const offset = layerOffset(i);
      gf.el.style.transform = `translate(${offset}px, ${offset}px)`;
    });

    // \u672c\u7269\u306e\u5148\u8aad\u307f\u30ad\u30e5\u30fc\u3088\u308a\u5965\u306e\u30c0\u30df\u30fc\u5c64\u306f\u3001\u533f\u540d\u306e\u98fe\u308a\u306a\u306e\u3067\u4f5c\u308a\u76f4\u3057\u3066\u3082\u5b89\u3044(\u6bce\u56de\u524a\u9664\u3057\u3066\u73fe\u5728\u306e\u679a\u6570\u306b\u5408\u308f\u305b\u3066\u4f5c\u308a\u76f4\u3059)
    if (stack) {
      [...stack.querySelectorAll('.ghost')].forEach(g => g.remove());
      for (let i = ghostFaces.length; i < remainingTotal; i++) {
        const g = document.createElement('div');
        g.className = 'ghost';
        const offset = layerOffset(i);
        g.style.transform = `translate(${offset}px, ${offset}px)`;
        g.style.zIndex = String(remainingTotal - i);
        stack.appendChild(g);
      }
    }
  } else {
    // フォールバック:通常の再抽選・再描画。
    // 直前でガチャの演出が始まったばかりの場合、ここで即座に全体再描画(renderStack)すると
    // 演出ごと画面から消えてしまうため、演出の再生が終わるまで、この再描画だけを遅らせる
    const capturedJustSkippedId = justSkippedId; // 関数末尾で先にnull化されるため、ここで確保しておく
    const doFallbackRedraw = () => {
      currentCard = pickCard(capturedJustSkippedId ? [capturedJustSkippedId] : null, true);
      const remaining = currentCard ? Math.min(THICKNESS_REAL_CAP, Math.max(0, cards.length - 1)) : 0;
      const excludeForQueue = currentCard ? [currentCard.id] : [];
      if (capturedJustSkippedId) excludeForQueue.push(capturedJustSkippedId);
      lookaheadQueue = currentCard ? buildLookaheadQueue(remaining, excludeForQueue) : [];
      nextCard = lookaheadQueue[0] || null;
      renderStack();
      scheduleDropboxUpload();
    };
    if (gachaEffectDelayMs > 0) {
      deferredRedrawPending = true;
      setTimeout(() => {
        doFallbackRedraw();
        deferredRedrawPending = false;
        isTransitioning = false; // 遅延中ブロックしていた操作を、ここで初めて解放する
      }, gachaEffectDelayMs);
    } else {
      doFallbackRedraw();
    }
  }
  justSkippedId = null;
  scheduleDropboxUpload(); // 他端末でも同じカードが前面に来るよう、選出結果を同期する
}

// カードの中身(タイトル・時間・タイマー・ボタン列)を、前面用・控え用で共通の構造で作る
// 分解済みタスクなら、総ステップ数と現在の段階を表すドット要素を作る。分解されていなければnull
// 「自発的にやりたい」カードが前面に出た瞬間、キラキラ粒子を弾けさせる
function playSSREffect(stack) {
  // 演出は「あればなお良い」程度の付加要素なので、万が一ここで何か失敗しても、
  // スキップ・完了・タイマーなど本体の動作を絶対に止めないよう、丸ごと保護しておく
  try {
    if (!stack) return;
    const burst = document.createElement('div');
    burst.className = 'ssr-burst';

    // 中心から円状に均等な角度で、距離とサイズをランダムに散らして星を弾き飛ばす
    const sparkleCount = 14;
    for (let i = 0; i < sparkleCount; i++) {
      const angle = (Math.PI * 2 * i) / sparkleCount + (Math.random() - 0.5) * 0.4;
      const dist = 55 + Math.random() * 55; // カードのすぐ外側にとどめ、ページのはみ出しを防ぐ
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const size = 8 + Math.random() * 10;
      const sp = document.createElement('div');
      sp.className = 'ssr-sparkle';
      sp.style.width = `${size}px`;
      sp.style.height = `${size}px`;
      sp.style.marginLeft = `${-size / 2}px`;
      sp.style.marginTop = `${-size / 2}px`;
      sp.style.setProperty('--dx', `${dx}px`);
      sp.style.setProperty('--dy', `${dy}px`);
      sp.style.animationDelay = `${(i % 5) * 0.045}s`;
      burst.appendChild(sp);
    }

    stack.appendChild(burst);
    // 念のため、アニメーション終了イベントとタイマーの両方で確実に片付ける
    let removed = false;
    const remove = () => { if (!removed) { removed = true; burst.remove(); } };
    const lastSparkle = burst.lastElementChild;
    if (lastSparkle) lastSparkle.addEventListener('animationend', remove, { once: true });
    setTimeout(remove, 1200);
  } catch (e) {
    console.error('SSR演出でエラー(本体には影響しません):', e);
  }
}

function buildStepDotsEl(cardData) {
  if (cardData.parentId == null || cardData.order == null || !cardData.totalSteps) return null;
  const dotsWrap = document.createElement('div');
  dotsWrap.className = 'step-dots';
  const currentIdx = cardData.order - 1; // 0始まり
  for (let i = 0; i < cardData.totalSteps; i++) {
    const dot = document.createElement('span');
    if (i < currentIdx) dot.className = 'step-dot done';
    else if (i === currentIdx) dot.className = 'step-dot current';
    else dot.className = 'step-dot future';
    dotsWrap.appendChild(dot);
  }
  return dotsWrap;
}

function buildCardFace(cardData) {
  const card = document.createElement('div');
  card.className = 'card';

  // want(やりたさ)が万一おかしな値(未定義・範囲外・NaN等)だった場合でも、
  // card-innerの色付けクラス(want-0〜3)自体が丸ごと欠落して「灰色の空白」になってしまわないよう、安全な値に補正しておく
  const safeWant = [0, 1, 2, 3].includes(cardData.want) ? cardData.want : 1;

  const cardInner = document.createElement('div');
  cardInner.className = `card-inner want-${safeWant}`;

  const topRow = document.createElement('div');
  topRow.className = 'top-row';

  const leftGroup = document.createElement('div');
  leftGroup.className = 'top-row-left';

  const locSpan = document.createElement('span');
  locSpan.className = 'loc-span';
  if (cardData.location) {
    locSpan.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>' + cardData.location + '</span>';
  }
  leftGroup.appendChild(locSpan);

  // 分解済みタスクの場合、総ステップ数と現在の段階をドットで表す
  const stepDots = buildStepDotsEl(cardData);
  if (stepDots) leftGroup.appendChild(stepDots);

  const miniActions = document.createElement('div');
  miniActions.className = 'actions-mini';
  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn';
  editBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  miniActions.appendChild(editBtn);
  topRow.appendChild(leftGroup);
  topRow.appendChild(miniActions);

  const center = document.createElement('div');
  center.className = 'center';
  const p1 = document.createElement('p'); p1.textContent = cardData.title;
  const timerEl = document.createElement('div'); timerEl.className = 'timer';
  const countEl = document.createElement('span'); countEl.className = 'timer-count';
  countEl.textContent = formatClock(cardData.time); // カウントダウン開始前は満タンの時間を時計表記で表示
  const totalEl = document.createElement('span'); totalEl.className = 'timer-total';
  totalEl.textContent = ' / ' + formatClock(cardData.time);
  timerEl.appendChild(countEl);
  timerEl.appendChild(totalEl);
  center.appendChild(p1);

  const iconRow = document.createElement('div');
  iconRow.className = 'icon-action-row';

  const doneBtn = document.createElement('button');
  doneBtn.className = 'icon-action-btn';
  doneBtn.setAttribute('aria-label', '完了');
  doneBtn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

  const skipBtn = document.createElement('button');
  skipBtn.className = 'icon-action-btn';
  skipBtn.setAttribute('aria-label', 'スキップ');
  skipBtn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 5v14l9-7z"/><path d="M13 5v14l9-7z"/></svg>';

  iconRow.appendChild(doneBtn);
  iconRow.appendChild(skipBtn);

  cardInner.appendChild(topRow);
  cardInner.appendChild(center);
  card.appendChild(cardInner);

  // 時間表示タブ:card-innerの白い縁の下辺と、タブ自身の下辺がぴったり合うように、
  // card自身の子として(card-innerとは独立に)配置する。横は中央寄せ
  const timeTab = document.createElement('div');
  timeTab.className = 'time-tab';
  timeTab.appendChild(timerEl);
  card.appendChild(timeTab);

  let decBtn = null;
  const hasChildren = cards.some(x => x.parentId === cardData.id);
  if (!hasChildren) {
    decBtn = document.createElement('button');
    decBtn.className = 'icon-action-btn';
    decBtn.setAttribute('aria-label', '分解する');
    // カード1枚が2枚に分かれるアイコン
    decBtn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-9 6 12)"><path d="M3,5 L9,5 L7,9 L10,12 L7,15 L9,19 L3,19 Z"/></g><g transform="rotate(9 18 12)"><path d="M21,5 L15,5 L17,9 L14,12 L17,15 L15,19 L21,19 Z"/></g></svg>';
    iconRow.appendChild(decBtn);
  }

  card.appendChild(iconRow);

  return { el: card, timerEl, countEl, doneBtn, skipBtn, decBtn, editBtn };
}

function renderStack() {
  const area = document.getElementById('stackArea');
  area.innerHTML = '';
  frontFace = null;
  ghostFaces = [];
  // 「表示できるカードが無い」場合でも、シャッフル演出フラグは必ずここで消費しておく。
  // そうしないと、後の全然関係ないタイミングまでフラグが持ち越されてしまう
  const showCutEffect = pendingShuffleAnim;
  pendingShuffleAnim = false;

  if (!currentCard) {
    const msg = cards.length === 0 ? 'デッキが空です。<br>今日はここまで。' : '今出せるカードがありません。<br>また後で開いてみてください。';
    area.innerHTML = `<div class="empty-msg">${msg}</div>`;
    return;
  }

  const stack = document.createElement('div');
  stack.className = 'stack';

  // 控え全枚数ぶん、あらかじめ本物のカードとして用意しておく。手前の1枚だけ色と文字を見せ、
  // \u305d\u308c\u3088\u308a\u5965\u306fCSS\u3067\u8986\u3044\u96a0\u3057\u3066\u898b\u305f\u76ee\u3060\u3051\u30c0\u30df\u30fc\u98a8\u306b\u3059\u308b(\u5b9f\u4f53\u306f\u305a\u3063\u3068\u672c\u7269\u306e\u307e\u307e)
  const remaining = Math.min(THICKNESS_CAP, Math.max(0, cards.length - 1));
  lookaheadQueue.forEach((cardData, i) => {
    const face = buildCardFace(cardData);
    face.el.classList.add('peek');
    if (i > 0) face.el.classList.add('masked');
    const offset = layerOffset(i);
    face.el.style.transform = `translate(${offset}px, ${offset}px)`;
    face.el.style.zIndex = String(remaining - i);
    face.el.style.pointerEvents = 'none';
    stack.appendChild(face.el);
    ghostFaces.push({ data: cardData, ...face });
  });

  // \u672c\u7269\u306e\u5148\u8aad\u307f\u30ad\u30e5\u30fc\u3088\u308a\u5965(6\u679a\u76ee\u4ee5\u964d)\u306f\u3001\u4e2d\u8eab\u3092\u6301\u305f\u306a\u3044\u8efd\u91cf\u306a\u30c0\u30df\u30fc\u3067\u5206\u539a\u307f\u3060\u3051\u8868\u73fe\u3059\u308b
  for (let i = lookaheadQueue.length; i < remaining; i++) {
    const g = document.createElement('div');
    g.className = 'ghost';
    const offset = layerOffset(i);
    g.style.transform = `translate(${offset}px, ${offset}px)`;
    g.style.zIndex = String(remaining - i);
    stack.appendChild(g);
  }

  const c = currentCard;
  const face = buildCardFace(c);
  const card = face.el;
  if (pendingRevealAnim) {
    card.classList.add('reveal');
    card.addEventListener('animationend', () => card.classList.remove('reveal'), { once: true });
    pendingRevealAnim = false;
  }
  if (c.want === 3) {
    lastRareId = c.id;
    card.classList.add('ssr-entrance');
    card.addEventListener('animationend', () => card.classList.remove('ssr-entrance'), { once: true });
  }
  face.editBtn.onclick = () => openEdit(c);
  face.doneBtn.onclick = () => completeCard(c);
  face.skipBtn.onclick = () => skipCard(c);
  if (face.decBtn) face.decBtn.onclick = () => openDecompose(c);

  // 控えのz-indexは「remainingTotal - i」で計算され、デッキ枚数が多いと10を超えることがある。
  // .card基本クラスのz-index:10だけに頼ると、その場合に控えが前面より手前に来てしまうため、
  // 前面カードには常にどんな状況でも控えを上回る、明示的に強いz-indexを設定しておく
  card.style.zIndex = '100';
  stack.appendChild(card);
  frontFace = { data: c, ...face };
  area.appendChild(stack);
  if (c.want === 3) playSSREffect(stack);

  if (showCutEffect) {
    const cutCard = document.createElement('div');
    cutCard.className = 'cut-card';
    stack.appendChild(cutCard);
    cutCard.addEventListener('animationend', () => cutCard.remove(), { once: true });

    const cutCardIn = document.createElement('div');
    cutCardIn.className = 'cut-card-in';
    stack.appendChild(cutCardIn);
    cutCardIn.addEventListener('animationend', () => cutCardIn.remove(), { once: true });

    const cutCardIn2 = document.createElement('div');
    cutCardIn2.className = 'cut-card-in2';
    stack.appendChild(cutCardIn2);
    cutCardIn2.addEventListener('animationend', () => cutCardIn2.remove(), { once: true });
  }

  startTimer(face.countEl, c.time, c.id);
}


// ===== 通知(ブラウザのNotification APIのみ。アプリを開いている間だけ動作する) =====
function notifyTimeUp() {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted' || !currentCard) return;
  try {
    const body = currentCard.want === 3 ? 'そろそろ終わりの時間です' : '目標時間になりました';
    new Notification(currentCard.title, { body, tag: 'shuffle-tasks-timer' });
  } catch (e) {
    console.error(e);
  }
}

// ===== タイマー(絶対時刻基準:setIntervalの積み重ね誤差やバックグラウンド遅延で
//       ズレないよう、常に「終了予定の時刻」との差分を計算し直す。閉じて開き直しても復元される) =====
const TIMER_STATE_KEY = 'shuffle_tasks_timer_state_v1';
let timerElRef = null;
let timerEndAt = 0;
let pendingTimerSeed = null; // 他端末の残り時間を一度だけ優先的に使うための仕込み({cardId, endAt})

function loadTimerState() {
  try { return JSON.parse(localStorage.getItem(TIMER_STATE_KEY)); } catch (e) { return null; }
}
function saveTimerState(cardId, endAt) {
  localStorage.setItem(TIMER_STATE_KEY, JSON.stringify({ cardId, endAt }));
}
function clearTimerState() {
  localStorage.removeItem(TIMER_STATE_KEY);
}

function startTimer(el, minutes, cardId) {
  timerElRef = el;
  // minutesが万一おかしな値(未定義・NaN等)だった場合、timerEndAt自体がNaNになり、
  // カウントダウンが「NaN:NaN」のまま永久に止まって見えるバグになるため、安全な値に補正しておく
  const safeMinutes = (typeof minutes === 'number' && isFinite(minutes) && minutes > 0) ? minutes : 15;
  if (pendingTimerSeed && pendingTimerSeed.cardId === cardId &&
      typeof pendingTimerSeed.endAt === 'number' && isFinite(pendingTimerSeed.endAt)) {
    // 他端末から同期してきた、この特定の一回だけの終了予定時刻(drawCard内のclearTimerでは消えない)
    timerEndAt = pendingTimerSeed.endAt;
    if (cardId) saveTimerState(cardId, timerEndAt);
    pendingTimerSeed = null;
  } else {
    const saved = cardId ? loadTimerState() : null;
    if (saved && saved.cardId === cardId && typeof saved.endAt === 'number' && isFinite(saved.endAt)) {
      // 同じカードのタイマーが既に動いていた(再読み込みなど) → 終了予定時刻をそのまま引き継ぐ
      timerEndAt = saved.endAt;
    } else {
      timerEndAt = Date.now() + Math.max(0, Math.round(safeMinutes * 60)) * 1000;
      if (cardId) saveTimerState(cardId, timerEndAt);
    }
  }
  updateTimerLabel();
  timerInterval = setInterval(updateTimerLabel, 1000);
}
function updateTimerLabel() {
  if (!timerElRef) return;
  const secondsLeft = Math.max(0, Math.round((timerEndAt - Date.now()) / 1000));
  if (secondsLeft <= 0) {
    clearInterval(timerInterval);
    clearTimerState();
    if (currentCard) {
      timerElRef.textContent = currentCard.want === 3 ? 'そろそろ終わりです' : '経過';
    }
    notifyTimeUp();
    return;
  }
  const m = Math.floor(secondsLeft/60);
  const s = secondsLeft % 60;
  // 分を2桁固定にして、桁数のブレ(9:58→10:12のような幅の変化)をなくす
  timerElRef.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function clearTimer() { if (timerInterval) clearInterval(timerInterval); clearTimerState(); }

// 前面カードが去るのと同時に、控え全員を1枚分前へスライドさせる(山全体が押し出される動き)。
// 1つ前に繰り上がる控えは、このタイミングでマスクを外して色と文字を見せる
function shiftGhostsForward(durationMs) {
  ghostFaces.forEach((gf, i) => {
    gf.el.style.transition = `transform ${durationMs}ms ease`;
    const newOffset = i === 0 ? 0 : 8 + (i - 1) * 9;
    gf.el.style.transform = `translate(${newOffset}px, ${newOffset}px)`;
    if (i === 1) {
      gf.el.classList.remove('masked');
    }
  });
}


// ===== アクション =====
function nextMidnight() {
  const d = new Date();
  d.setHours(24,0,0,0);
  return d.getTime();
}

function completeCard(c) {
  if (isTransitioning) return; // 連打による二重発火を防ぐ
  isTransitioning = true;
  // 保留中のガチャがあれば、控えを一枚ずつ寄せていくアニメーションが始まる前に、ここで先に結果を出しておく。
  // (アニメーション開始後に結果を出すと、一瞬「差し替わる前のカード」が見えてしまうため)
  pendingGachaEffectDelayMs = resolvePendingGachaIfAny();
  const doComplete = () => {
    try {
      // ポイント加算(want=2は軽め、それ以外は達成価値を高めに)。
      // ただし、割り当てた時間を過ぎてから完了した場合は加算しない
      const gain = c.want === 2 ? 0.5 : 1;
      const timeIsUp = Date.now() >= timerEndAt;
      if (c.want !== 3 && !timeIsUp) { // 報酬系の消化はタスクポイントに数えない
        points.task += gain;
        savePoints(points);
      }
      cards = cards.filter(x => x.id !== c.id);
      if (c.loopType === 'anytime') {
        // 何度でも:完了直後、即座にまた出現候補に戻す
        cards.push({...c, id: uid(), skipStreak:0, availableAfter:0});
      } else if (c.loopType === 'daily') {
        // 1日1回:翌日0時まで出現しないカードとして戻す
        cards.push({...c, id: uid(), skipStreak:0, availableAfter: nextMidnight()});
      }
      // loopType 'none' はそのまま消える
      saveCards(cards);
      globalSkipStreak = 0; // 何か1枚でも完了したら、連続スキップのカウントはリセットする
      renderSkipGauge();
      promoteNextCard();
      cardEl.remove(); // 退場アニメーション後の古い要素をDOMから確実に取り除く
    } finally {
      // 途中で何が起きても、操作不能(連打防止フラグが戻らなくなる)には絶対に陥らないようにする。
      // ただし、ガチャ演出待ちで全体再描画をまだ実行していない間だけは、状態がズレるのを防ぐため維持する
      if (!deferredRedrawPending) isTransitioning = false;
    }
  };
  const cardEl = frontFace ? frontFace.el : null;
  if (cardEl) {
    clearTimer();
    cardEl.classList.add('fly-out');
    shiftGhostsForward(380);
    cardEl.addEventListener('animationend', doComplete, { once: true });
  } else {
    doComplete();
  }
}

// 今のカード以外に、切り替えられる(出現条件を満たす)カードが他にあるかどうか
function hasSkipAlternative(excludeId) {
  const now = Date.now();
  return cards.some(c => c.id !== excludeId && !isChildBlocked(c) && (!c.availableAfter || c.availableAfter <= now));
}

function skipCard(c) {
  if (isTransitioning) return; // 連打による二重発火を防ぐ
  if (!hasSkipAlternative(c.id)) {
    // 他に切り替えられるカードが無い場合は、何もせず振動だけ返す(点滅なし)
    const cardElNow = frontFace ? frontFace.el : null;
    if (cardElNow) {
      cardElNow.classList.remove('no-alt-shake');
      void cardElNow.offsetWidth;
      cardElNow.classList.add('no-alt-shake');
      cardElNow.addEventListener('animationend', () => cardElNow.classList.remove('no-alt-shake'), { once: true });
    }
    return;
  }
  isTransitioning = true;

  globalSkipStreak += 1; // 課金判定用の「連続スキップ回数」(カードの種類を問わない)
  renderSkipGauge();

  // 「自発的にやりたい」カード自身の連続スキップ(=自称と実態のズレ)を検知し、
  // 閾値に達していたら、この一回で格下げする(「やれなくもない」へ)
  let willDemote = false;
  if (c.want === 3) {
    const nextStreak = (c.skipStreak || 0) + 1;
    willDemote = nextStreak >= DEMOTE_THRESHOLD;
  }

  // 連続スキップの課金:1・2回目は無償、3回目以降は0.2消費。
  // ただしこの一回で格下げが発動する場合は、既に「データを正直な状態に戻す」という
  // より本質的な対処が働くので、二重の罰にしないよう課金は免除する
  if (globalSkipStreak >= 3 && !willDemote) {
    spendPoints(SKIP_COST);
    renderPoints();
  }

  // 保留中のガチャがあれば、控えを一枚ずつ寄せていくアニメーションが始まる前に、ここで先に結果を出しておく。
  // (アニメーション開始後に結果を出すと、一瞬「差し替わる前のカード」が見えてしまうため)
  pendingGachaEffectDelayMs = resolvePendingGachaIfAny();

  const doSkip = () => {
    try {
      justSkippedId = c.id; // 直後の1サイクルだけ、このカードを控えの選出から除外する
      if (c.want === 3) {
        cards = cards.map(x => {
          if (x.id !== c.id) return x;
          if (willDemote) return {...x, want: 1, skipStreak: 0};
          return {...x, skipStreak: (x.skipStreak || 0) + 1};
        });
      }
      saveCards(cards);
      promoteNextCard();
      cardEl.remove(); // 退場アニメーション後の古い要素をDOMから確実に取り除く
    } finally {
      // 遅延中(ガチャ演出待ち)の間だけは、状態がズレるのを防ぐため維持する
      if (!deferredRedrawPending) isTransitioning = false;
    }
  };
  const cardEl = frontFace ? frontFace.el : null;
  if (cardEl) {
    clearTimer();
    cardEl.classList.add('to-back');
    shiftGhostsForward(500);
    cardEl.addEventListener('animationend', doSkip, { once: true });
  } else {
    doSkip();
  }
}

function deleteCard(id) {
  const target = cards.find(x => x.id === id);
  // 分解タスクの「今、列の一番手前にある手順」を消す場合だけ、宙ぶらりんの手順が残らないよう、
  // 同じ列の兄弟を全部まとめて消す。それより後ろの手順を消す場合は、手前の手順には影響しない
  let cascadeParentId = null;
  if (target && target.parentId != null) {
    const siblings = cards.filter(x => x.parentId === target.parentId);
    const minOrder = Math.min(...siblings.map(s => s.order ?? 0));
    if ((target.order ?? 0) === minOrder) cascadeParentId = target.parentId;
  }
  cards = cards.filter(x => {
    if (x.id === id || x.parentId === id) return false; // 自分自身、および自分の子(親タスクを消した場合)
    if (cascadeParentId != null && x.parentId === cascadeParentId) return false; // 列の先頭を消した時だけ、同じ列の兄弟も
    return true;
  });
  saveCards(cards);
  drawCard();
}

document.getElementById('decSaveBtn').onclick = () => {
  const c = decomposeTarget;
  if (!c) return;
  // 空欄で追加してしまったステップ(タスク名が空欄)は自動的に無視する
  const stepBoxes = [...document.querySelectorAll('.dec-step')];
  const steps = stepBoxes.map(box => {
    const title = box.querySelector('.dec-step-input').value.trim();
    const time = Number(box.querySelector('.dec-step-time').value) || 15;
    const want = Number(box.querySelector('.dec-step-want').value);
    const location = box.querySelector('.dec-step-location').value;
    return { title, time, want, location };
  }).filter(s => s.title.length > 0);

  if (steps.length === 0) { document.getElementById('decError').style.display = 'block'; return; }

  // 分解先のグループを決める:
  // ・cがまだ何にも属していない(新規の元タスク)場合は、cのidを親とする新しい列を作る
  // ・cが既に何かの列の一員(=手順をさらに分解する)場合は、同じ列の「cがいた位置」に差し込む
  const targetParentId = c.parentId != null ? c.parentId : c.id;
  const startOrder = c.parentId != null ? c.order : 1; // cがいた位置から差し込む。新規の場合は1から
  const stepCount = steps.length;

  if (c.parentId != null) {
    // 差し込む分だけ、後ろの手順のorderをまとめてずらして席を空ける(1つ消えてstepCount個に置き換わる)
    cards = cards.map(x => {
      if (x.parentId === targetParentId && x.order > c.order) {
        return {...x, order: x.order + stepCount - 1};
      }
      return x;
    });
  }

  // 元カードを削除し、新しい手順を列の正しい位置に差し込む
  cards = cards.filter(x => x.id !== c.id);
  steps.forEach((s, i) => {
    cards.push({id: uid(), title: s.title, time: s.time, want: s.want, location: s.location, loopType:'none', order: startOrder + i, parentId: targetParentId, skipStreak:0, availableAfter:0});
  });

  // 列全体の総ステップ数を数え直し、メンバー全員のtotalStepsを更新する(進捗ドット表示のため)
  const totalSteps = cards.filter(x => x.parentId === targetParentId).length;
  cards = cards.map(x => x.parentId === targetParentId ? {...x, totalSteps} : x);

  saveCards(cards);
  decomposeTarget = null;
  document.getElementById('decomposeOverlay').classList.remove('open');
  const firstStep = [...cards].filter(x => x.parentId === targetParentId).sort((a,b)=>a.order-b.order)[0];
  drawCard(firstStep);
};

const overlay = document.getElementById('overlay');
const wantSelect = document.getElementById('wantSelect');
